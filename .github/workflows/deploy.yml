name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Recipes
        run: |
          for f in recipes/content/*.json; do
            bash recipes/build.sh "$f" recipes/
          done

      # The gate runs AFTER the recipe build on purpose: build.sh regenerates
      # the recipe pages from _template.html + content/*.json, so gating before
      # it checks the committed sources rather than the artifact being deployed.
      - name: Content gate tests
        run: python3 -B tests/test_content_gate.py

      - name: Content gate (rejected words)
        run: python3 -B tools/content_gate.py

      # recipes/_template.html is a build input, not a page. The artifact is the
      # whole repo, so without this it is served publicly with __TOKEN__
      # placeholders unfilled (verified live 2026-09-24).
      - name: Strip build-only files from the artifact
        run: rm -f recipes/_template.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
